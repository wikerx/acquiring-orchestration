# 结算服务本地启动基线；调用方、路径和鉴权时间窗由 service-settlement-{env}.yaml 提供。
server:
  port: 8011
  shutdown: graceful

spring:
  application:
    name: service-settlement
  profiles:
    active: @profiles.active@
  main:
    allow-bean-definition-overriding: true

# 结算批次和候选认领没有 yml/Nacos 业务启停开关；停止处理必须下线服务实例或暂停后续调度入口。

internal-service:
  auth:
    # 安全门禁固定留在本地，不允许通过 Nacos 关闭结算管理接口鉴权。
    enabled: true
