# 环境接入配置：当前文件只负责连接对应环境的 Nacos 命名空间。
# 网关只拉取服务专属配置和公共配置，不引入数据库、分表、Redis、MQ、Seata、XXL-JOB。
spring:
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    bootstrap:
      enabled: true
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:nacos-prod:8848}
        namespace: ${NACOS_NAMESPACE:prod}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        register-enabled: true
      config:
        server-addr: ${NACOS_SERVER:nacos-prod:8848}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        username: ${spring.cloud.nacos.discovery.username}
        password: ${spring.cloud.nacos.discovery.password}
        group: DEFAULT_GROUP
        file-extension: yaml
        encode: UTF-8
        refresh-enabled: true
        config-retry-time: 3
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/admin/**]":
                allowed-origin-patterns:
                  - ${ADMIN_CORS_ORIGIN:https://admin.xxx.com}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [X-Trace-Id]
                allow-credentials: false
                max-age: 1800
              "[/merchant/**]":
                allowed-origin-patterns:
                  - ${MERCHANT_CORS_ORIGIN:https://merchant.xxx.com}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [X-Trace-Id]
                allow-credentials: false
                max-age: 1800
              "[/api/rest/**]":
                allowed-origin-patterns:
                  - ${OPENAPI_CORS_ORIGIN:https://openapi.xxx.com}
                allowed-methods: [GET, POST, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [X-Trace-Id]
                allow-credentials: false
                max-age: 1800
              "[/channel/**]":
                allowed-origin-patterns:
                  - ${CHANNEL_CORS_ORIGIN:https://channel.xxx.com}
                allowed-methods: [POST, OPTIONS]
                allowed-headers: "*"
                allow-credentials: false
                max-age: 1800
              "[/openapi/**]":
                allowed-origin-patterns:
                  - ${OPENAPI_SUPPORT_CORS_ORIGIN:https://openapi.xxx.com}
                allowed-methods: [GET, POST, OPTIONS]
                allowed-headers: "*"
                allow-credentials: false
                max-age: 1800

logging:
  config: classpath:log-config/logback-spring.xml
