# 环境接入配置：当前文件只负责连接对应环境的 Nacos 命名空间。
# 网关只拉取服务专属、公共和 Redis 配置，不引入数据库、分表、MQ、Seata、XXL-JOB。
spring:
  config:
    import:
      # dev 可叠加 live-regression profile，因此 DataId 必须明确绑定 dev，不能使用逗号分隔的 active profiles。
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
      # 参数说明：导入公共 Nacos DataId，统一时间、监控和链路追踪配置。
      - optional:nacos:common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
      # 参数说明：导入 Redis 连接和环境 Key 前缀，供网关分布式 IP 限流使用。
      - optional:nacos:redis-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    bootstrap:
      # 参数说明：控制 Spring Cloud Bootstrap 提前加载 Nacos 配置；关闭会导致远程配置无法在自动装配前生效。
      enabled: true
    nacos:
      discovery:
        # 参数说明：配置 Nacos 服务地址；每个环境必须连接本环境 Nacos，禁止跨环境注册或拉取配置。
        # 环境说明：环境变量：NACOS_SERVER（dev 配置默认 "127.0.0.1:8848"）；test/uat/prod 必须指向本环境可达的基础设施，禁止跨环境连接。
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        # 参数说明：配置 Nacos 命名空间；dev、test、uat、prod 必须使用不同 namespace ID 隔离。
        # 环境说明：环境变量：NACOS_NAMESPACE（当前默认值为 "324ad8dc-58d0-4d0d-b264-24a9f951a2b0"）；dev、test、uat、prod 必须使用不同 namespace ID，防止服务注册和配置跨环境串用。
        namespace: ${NACOS_NAMESPACE:324ad8dc-58d0-4d0d-b264-24a9f951a2b0}
        # 参数说明：配置外部组件账号；UAT/生产必须使用最小权限的环境专属账号。
        # 环境说明：环境变量：NACOS_USERNAME（文件中的账号默认值仅供 dev 配置本地联调）；test/uat/prod 必须注入本环境最小权限账号，禁止使用 nacos、root 等开发默认账号。
        username: ${NACOS_USERNAME:nacos}
        # 参数说明：配置访问外部组件的密码，必须按环境通过 Secret 注入并定期轮换。
        # 环境说明：环境变量：NACOS_PASSWORD；文件中的弱默认值仅供 dev 配置本地联调，test/uat/prod 必须使用独立高强度 Secret 注入并定期轮换。
        password: ${NACOS_PASSWORD:nacos}
        # 参数说明：控制服务是否注册到 Nacos；正常 test/uat/prod 部署必须开启。
        register-enabled: true
      config:
        # 参数说明：配置 Nacos 服务地址；每个环境必须连接本环境 Nacos，禁止跨环境注册或拉取配置。
        # 环境说明：环境变量：NACOS_SERVER（dev 配置默认 "127.0.0.1:8848"）；test/uat/prod 必须指向本环境可达的基础设施，禁止跨环境连接。
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        # 参数说明：配置 Nacos 命名空间；dev、test、uat、prod 必须使用不同 namespace ID 隔离。
        namespace: ${spring.cloud.nacos.discovery.namespace}
        # 参数说明：配置外部组件账号；UAT/生产必须使用最小权限的环境专属账号。
        username: ${spring.cloud.nacos.discovery.username}
        # 参数说明：配置访问外部组件的密码，必须按环境通过 Secret 注入并定期轮换。
        password: ${spring.cloud.nacos.discovery.password}
        # 参数说明：指定注册或配置所属分组；同一环境的服务端与客户端必须一致。
        group: DEFAULT_GROUP
        # 参数说明：指定 Nacos DataId 文件扩展名，当前项目统一使用 yaml。
        file-extension: yaml
        # 参数说明：指定 Nacos 配置内容编码，项目 YAML 统一使用 UTF-8。
        encode: UTF-8
        # 参数说明：控制 Nacos 配置变更是否动态刷新；涉及连接池或安全密钥时仍需按组件能力评估重启。
        refresh-enabled: true
        # 参数说明：配置 Nacos 拉取配置失败后的重试次数，必须为非负整数。
        config-retry-time: 3

logging:
  # 参数说明：指定日志配置文件或 Spring 配置资源路径，必须存在于应用 classpath。
  config: classpath:log-config/logback-spring.xml

acquiring:
  gateway:
    client-ip:
      # 是否允许从 X-Forwarded-For 解析真实客户端 IP，取值为 true/false。
      # false：忽略外部转发头并使用 TCP 直连地址；true：仅当 TCP 直连地址命中下方可信 CIDR 时才读取转发链。
      trust-forwarded-header: ${GATEWAY_TRUST_FORWARDED_HEADER:false}
      # 可信反向代理或负载均衡器网段，多个 CIDR 使用英文逗号分隔，例如 10.0.0.0/8,2001:db8::/32。
      # 留空表示不信任任何代理；禁止配置 0.0.0.0/0 或 ::/0，否则调用方可能伪造 IP 绕过白名单和限流。
      trusted-proxy-cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}
    rate-limit:
      # 是否启用 Gateway 第一层 IP 限流；true 时按解析后的客户端 IP 累计全部 /api/rest/** 请求，OPTIONS 不计数。
      enabled: true
      # 单个客户端 IP 在一个滚动窗口内允许通过的最大请求数，必须为正整数；不同 OpenAPI 接口共享该额度。
      max-requests: 200
      # 精确滚动窗口长度，支持 Spring Duration 格式，例如 1m、60s 或 PT1M；必须大于 0。
      window: 1m
      # Redis 不可用时，每个 Gateway 实例最多保存的本地限流身份数，必须为正整数；达到上限后拒绝新的 IP 身份。
      # 该值只限制降级缓存的内存占用；本地降级时各实例独立计数，集群最坏可放行约“200 × Gateway 实例数”。
      local-max-identities: 10000
      # Redis 限流不可用时的策略：LOCAL_FALLBACK 使用本机有界窗口，FAIL_CLOSED 直接返回统一 HTTP 429。
      # 开发环境默认 LOCAL_FALLBACK，便于 Redis 未启动时联调；不得据此评估生产环境的全局额度精度。
      failure-policy: LOCAL_FALLBACK
