                allow-credentials: false
                # 参数说明：配置浏览器缓存 CORS 预检结果的时长，单位秒。
                max-age: 1800
              "[/admin/**]":
                allowed-origin-patterns:
                  # 参数说明：声明 CORS 允许的来源模式；UAT/生产必须使用明确 HTTPS 域名，禁止 localhost 和宽泛通配。
