                  # 参数说明：声明该路由允许的 HTTP 方法，遵循最小开放原则。
                  - DELETE
                  # 参数说明：声明该路由允许的 HTTP 方法，遵循最小开放原则。
                  - OPTIONS
                # 参数说明：配置 CORS 允许的请求头；生产应按实际前端请求收敛范围。
                allowed-headers: "*"
                exposed-headers:
