# 本地基础配置：只保留网关启动入口配置。
# 网关不直接连接数据库、分表、MQ、Seata、XXL-JOB；需要动态调整的网关规则放到 service-gateway-{env}.yaml。
server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: service-gateway
  profiles:
    active: @profiles.active@
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # 连接下游微服务的超时时间，单位毫秒。
            connect-timeout: 3000
            # 下游接口整体响应超时，避免网关线程长时间堆积。
            response-timeout: 10s
          default-filters:
            # 保留原始 Host，方便下游根据域名做审计或多租户判断。
            - PreserveHostHeader
            # 外部请求不透传浏览器 Cookie，避免商户 API 和后台登录态互相污染。
            - RemoveRequestHeader=Cookie
            # 移除底层容器响应头，减少技术栈暴露。
            - RemoveResponseHeader=Server
            # 跨域响应头只保留第一份，避免重复写入导致浏览器拒绝。
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST
            # 安全响应头可由部署层覆盖；网关先提供安全默认值。
            - name: AddResponseHeader
              args:
                name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            - name: AddResponseHeader
              args:
                name: X-Content-Type-Options
                value: nosniff
            - name: AddResponseHeader
              args:
                name: X-Frame-Options
                value: SAMEORIGIN
            - name: AddResponseHeader
              args:
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
            - name: AddResponseHeader
              args:
                name: Permissions-Policy
                value: "camera=(), microphone=(), geolocation=()"
            - name: AddResponseHeader
              args:
                name: Content-Security-Policy
                value: "default-src 'self'; frame-ancestors 'self'"
          globalcors:
            cors-configurations:
              "[/api/rest/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - X-Trace-Id
                allow-credentials: false
                max-age: 1800
              "[/channel/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - POST
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: false
                max-age: 1800
              "[/openapi/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: false
                max-age: 1800
              "[/admin/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - X-Trace-Id
                allow-credentials: false
                max-age: 1800
              "[/merchant/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - X-Trace-Id
                allow-credentials: false
                max-age: 1800
