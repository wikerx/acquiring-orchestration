# 本地基础配置：只保留服务端口、服务名、激活环境和 Spring Boot 基础开关。
# Redis、MQ、数据库、分表、Seata、XXL-JOB 等配置统一从 Nacos yaml DataId 读取。
server:
  port: 8004
  shutdown: graceful

spring:
  application:
    name: service-openapi
  profiles:
    active: @profiles.active@
  main:
    allow-bean-definition-overriding: true

openapi:
  security:
    secret-cache:
      # 密钥正文只允许在 OpenAPI 单实例内短时驻留，Redis 仅保存非敏感 revision。
      ttl: PT2M
      max-entries: 2048
    replay:
      # 本地默认不强制 Redis 防重放成功，避免未启动 Redis 时影响本地启动；生产环境必须在 application-prod.yml 开启。
      required: false
