# 本地基础配置：只保留服务端口、服务名、激活环境和 Spring Boot 基础开关。
# Redis、MQ、数据库、分表、Seata、XXL-JOB 等配置统一从 Nacos yaml DataId 读取。
server:
  port: 8002
  shutdown: graceful

spring:
  application:
    name: service-merchant
  profiles:
    active: @profiles.active@
  main:
    allow-bean-definition-overriding: true

acquiring:
  openapi:
    merchant-key-export:
      sdk-version: ${OPENAPI_JAVA_SDK_VERSION:0.9.0}
      crypto-mode: ${OPENAPI_CRYPTO_MODE:JWT + RSA-OAEP-256 + A256GCM}
