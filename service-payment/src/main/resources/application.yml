# 本地基础配置：只保留服务端口、服务名、激活环境和 Spring Boot 基础开关。
# Redis、MQ、数据库、分表、Seata、XXL-JOB 等配置统一从 Nacos yaml DataId 读取。
server:
  port: 8005
  shutdown: graceful

spring:
  application:
    name: service-payment
  profiles:
    active: @profiles.active@
  main:
    allow-bean-definition-overriding: true

payment:
  risk-client:
    # 本地骨架默认不远程调用 service-risk；生产接入前必须在配置中心开启并替换 Noop 风控。
    remote-enabled: false
    evaluate-url: http://service-risk/internal/risk/evaluate/payment
    internal-caller: service-payment
    internal-secret: dev-internal-service-secret
