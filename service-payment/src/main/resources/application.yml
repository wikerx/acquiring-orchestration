# 本地基础配置：只保留服务端口、服务名、激活环境和 Spring Boot 基础开关。
# Redis、MQ、数据库、分表、Seata、XXL-JOB 等配置统一从 Nacos yaml DataId 读取。
server:
  # 参数说明：配置服务监听端口，有效范围 1-65535；同一主机上的服务端口不得冲突。
  port: 8005
  # 参数说明：配置 Spring Boot 停机方式；graceful 会等待在途请求完成后退出。
  shutdown: graceful

spring:
  application:
    # 参数说明：指定当前微服务在 Nacos、日志和监控中的稳定服务名；不同环境保持同名并通过 namespace 隔离。
    name: service-payment
  profiles:
    # 参数说明：指定 Maven 过滤后激活的 Spring Profile，必须与部署环境名称一致。
    active: @profiles.active@
  main:
    # 参数说明：控制同名 Spring Bean 是否允许覆盖；开启时需防止配置顺序掩盖错误实现。
    allow-bean-definition-overriding: true

payment:
  checkout:
    sensitive-field-encryption-key: ${PAYMENT_TRANSACTION_SENSITIVE_FIELD_ENCRYPTION_KEY:dev-hosted-checkout-field-key-change-me}
    sensitive-field-key-version: ${PAYMENT_TRANSACTION_SENSITIVE_FIELD_KEY_VERSION:dev-v1}
    card-vault:
      # 必须先完成分片表、Topic、消费组和 service-data 密钥发布；默认关闭。
      enabled: ${CHECKOUT_CARD_VAULT_PUBLISH_ENABLED:false}
      key-id: ${CHECKOUT_CARD_VAULT_TRANSFER_KEY_ID:checkout-card-vault-v1}
      public-key-x509-base64: ${CHECKOUT_CARD_VAULT_TRANSFER_PUBLIC_KEY_X509_BASE64:}
  transaction:
    outbox:
      # 参数说明：控制事务 Outbox Relay 是否运行；关闭会导致已提交事件停止向 MQ 投递。
      # 环境说明：环境变量：PAYMENT_TRANSACTION_OUTBOX_RELAY_ENABLED，基础配置默认值为 "true"；test/uat/prod 必须按环境安全策略显式配置，禁止无评审沿用开发开关。
      relay-enabled: ${PAYMENT_TRANSACTION_OUTBOX_RELAY_ENABLED:true}
      # 参数说明：配置相邻两次任务完成后的固定等待时间，单位毫秒。
      # 环境说明：环境变量：PAYMENT_TRANSACTION_OUTBOX_FIXED_DELAY_MS，基础配置默认值为 "5000"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
      fixed-delay-ms: ${PAYMENT_TRANSACTION_OUTBOX_FIXED_DELAY_MS:5000}
      # 参数说明：配置应用启动后首次执行任务前的等待时间，单位毫秒。
      # 环境说明：环境变量：PAYMENT_TRANSACTION_OUTBOX_INITIAL_DELAY_MS，基础配置默认值为 "10000"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
      initial-delay-ms: ${PAYMENT_TRANSACTION_OUTBOX_INITIAL_DELAY_MS:10000}
      # 参数说明：配置单批处理记录数；增大可提高吞吐，但会增加数据库锁持有时间和单次失败影响。
      # 环境说明：环境变量：PAYMENT_TRANSACTION_OUTBOX_BATCH_SIZE，基础配置默认值为 "100"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
      batch-size: ${PAYMENT_TRANSACTION_OUTBOX_BATCH_SIZE:100}
  risk-client:
    # 初始交易必须调用 service-risk；仅单元测试或本地隔离调试才允许显式开启 noop-enabled。
    # 环境说明：环境变量：PAYMENT_RISK_CLIENT_REMOTE_ENABLED，基础配置默认值为 "true"；test/uat/prod 必须按环境安全策略显式配置，禁止无评审沿用开发开关。
    remote-enabled: ${PAYMENT_RISK_CLIENT_REMOTE_ENABLED:true}
    # 参数说明：控制 Noop 降级实现；仅本地隔离测试允许开启，UAT/生产必须为 false。
    # 环境说明：环境变量：PAYMENT_RISK_CLIENT_NOOP_ENABLED，基础配置默认值为 "false"；test/uat/prod 必须按环境安全策略显式配置，禁止无评审沿用开发开关。
    noop-enabled: ${PAYMENT_RISK_CLIENT_NOOP_ENABLED:false}
    # 参数说明：指定内部服务调用方标识，必须与被调用方签名白名单一致。
    internal-caller: service-payment
    # 参数说明：配置内部服务 HMAC-SHA256 共享密钥，调用方与被调用方必须使用同一环境的密钥。
    # 环境说明：环境变量：PAYMENT_RISK_INTERNAL_SECRET；默认值仅供 dev 本地联调，test/uat/prod 必须通过 K8s Secret、CI/CD Secret 或密钥管理系统注入独立高强度密钥。
    internal-secret: ${PAYMENT_RISK_INTERNAL_SECRET:dev-internal-service-secret}
