# 本地启动基线：只保留服务身份、端口和不可由远程配置关闭的安全门禁。
# Admin 客户端、内部调用方和业务运行参数统一从 service-admin-{env}.yaml 读取。
server:
  # 参数说明：配置服务监听端口，有效范围 1-65535；同一主机上的服务端口不得冲突。
  port: 8001
  # 参数说明：配置 Spring Boot 停机方式；graceful 会等待在途请求完成后退出。
  shutdown: graceful

spring:
  application:
    # 参数说明：指定当前微服务在 Nacos、日志和监控中的稳定服务名；不同环境保持同名并通过 namespace 隔离。
    name: service-admin
  profiles:
    # 参数说明：指定 Maven 过滤后激活的 Spring Profile，必须与部署环境名称一致。
    active: @profiles.active@
  main:
    # 参数说明：控制同名 Spring Bean 是否允许覆盖；开启时需防止配置顺序掩盖错误实现。
    allow-bean-definition-overriding: true

internal-service:
  auth:
    # 安全门禁固定留在本地，避免远程配置缺失或误操作时关闭内部接口鉴权。
    enabled: true
