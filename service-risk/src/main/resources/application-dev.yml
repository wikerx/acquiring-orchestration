# 环境接入配置：当前文件只负责连接 dev 环境的 Nacos 命名空间。
# service-risk 当前接入运行时名单/规则库、Redis 缓存和 MQ 异步审计。
spring:
  config:
    import:
      # dev 可叠加 live-regression profile，因此 DataId 必须明确绑定 dev，不能使用逗号分隔的 active profiles。
      - optional:nacos:${spring.application.name}-dev.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:common-dev.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:dataSource-dev.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:sharding-dev.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:redis-dev.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:rocketmq-dev.${spring.cloud.nacos.config.file-extension}
  cloud:
    bootstrap:
      enabled: true
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:324ad8dc-58d0-4d0d-b264-24a9f951a2b0}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        register-enabled: true
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        username: ${spring.cloud.nacos.discovery.username}
        password: ${spring.cloud.nacos.discovery.password}
        group: DEFAULT_GROUP
        file-extension: yaml
        encode: UTF-8
        refresh-enabled: true
        config-retry-time: 3

logging:
  config: classpath:log-config/logback-spring.xml
