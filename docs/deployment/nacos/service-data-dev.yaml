# service-data 专属配置：异步操作日志、风控与安全审计持久化，以及商户通知投递参数。
data:
  admin-client:
    # 参数说明：统一待办权威导出源地址；dev 默认通过 Nacos 服务发现访问 service-admin。
    base-url: ${DATA_ADMIN_EXPORT_BASE_URL:http://service-admin}
    # 参数说明：建立 Admin 内部连接的最大等待时间，单位毫秒。
    connect-timeout-millis: ${DATA_ADMIN_EXPORT_CONNECT_TIMEOUT_MILLIS:3000}
    # 参数说明：单页来源读取超时，失败后由导出任务重试状态机接管。
    read-timeout-millis: ${DATA_ADMIN_EXPORT_READ_TIMEOUT_MILLIS:30000}
    # 参数说明：Data 回调 Admin 的固定服务身份。
    internal-caller: service-data
    # 参数说明：Data 到 Admin 独立 HMAC 密钥引用，不复用 Job-Admin 密钥。
    internal-secret: ${acquiring.internal-auth.edges.data-admin.active-secret}
  merchant-client:
    # 参数说明：商户异步导出执行器分页读取 service-merchant 安全投影的服务地址。
    base-url: ${DATA_MERCHANT_EXPORT_BASE_URL:http://service-merchant}
    connect-timeout-millis: ${DATA_MERCHANT_EXPORT_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${DATA_MERCHANT_EXPORT_READ_TIMEOUT_MILLIS:30000}
    internal-caller: service-data
    # 参数说明：Data 到 Merchant 的独立调用边密钥，不复用 Data-Admin 凭据。
    internal-secret: ${acquiring.internal-auth.edges.data-merchant.active-secret}
  export:
    # 参数说明：每页最多读取100条，避免单次来源查询和Excel写入占用过多内存。
    page-size: ${DATA_EXPORT_PAGE_SIZE:100}
    # 参数说明：卡 BIN 与任务运行日志数据量较大，使用独立的500条内部页减少跨服务请求。
    platform-page-size: ${DATA_EXPORT_PLATFORM_PAGE_SIZE:500}
    # 参数说明：单轮最多领取两个文件任务，与专用执行器并发容量保持一致。
    dispatch-batch-size: ${DATA_EXPORT_DISPATCH_BATCH_SIZE:2}
    # 参数说明：单实例同时执行两个文件任务，避免大文件长期阻塞后续小任务。
    dispatch-concurrency: ${DATA_EXPORT_DISPATCH_CONCURRENCY:2}
    # 参数说明：自动执行失败最大尝试次数，耗尽后等待人工重试。
    max-retry-count: ${DATA_EXPORT_MAX_RETRY_COUNT:3}
    # 参数说明：执行租约必须覆盖一次文件生成和上传的合理最长时间。
    processing-lease: ${DATA_EXPORT_PROCESSING_LEASE:10m}
    # 参数说明：自动重试间隔。
    retry-delay: ${DATA_EXPORT_RETRY_DELAY:2m}
    # 参数说明：成功文件保留期限，到期后由调度任务删除私有对象。
    file-retention: ${DATA_EXPORT_FILE_RETENTION:7d}
    # 参数说明：单个导出文件硬上限，超过后任务失败且不上传对象。
    max-file-size-bytes: ${DATA_EXPORT_MAX_FILE_SIZE_BYTES:209715200}
    object-storage:
      # 参数说明：dev 复用公共对象存储开关，但使用独立 Bucket；仍可用导出专用环境变量单独关闭。
      enabled: ${DATA_EXPORT_OBJECT_STORAGE_ENABLED:${acquiring.object-storage.enabled:false}}
      provider: ${DATA_EXPORT_OBJECT_STORAGE_PROVIDER:MINIO}
      endpoint: ${DATA_EXPORT_OBJECT_STORAGE_ENDPOINT:${acquiring.object-storage.endpoint:http://127.0.0.1:9010}}
      region: ${DATA_EXPORT_OBJECT_STORAGE_REGION:${acquiring.object-storage.region:us-east-1}}
      # 参数说明：严禁复用商户资料Bucket，生命周期和访问策略必须独立。
      bucket: ${DATA_EXPORT_OBJECT_STORAGE_BUCKET:vexra-export-files}
      path-style-access: ${DATA_EXPORT_OBJECT_STORAGE_PATH_STYLE_ACCESS:${acquiring.object-storage.path-style-access:true}}
      # 凭据从 Nacos 公共对象存储配置引用，不在 service-data 模板复制明文。
      access-key: ${DATA_EXPORT_OBJECT_STORAGE_ACCESS_KEY:${acquiring.object-storage.access-key:}}
      secret-key: ${DATA_EXPORT_OBJECT_STORAGE_SECRET_KEY:${acquiring.object-storage.secret-key:}}
  merchant-api-response-audit:
    mq:
      # 仅 service-data 消费 OpenAPI 响应审计；关闭后消息保留在独立消费组进度中，恢复开关可继续补偿。
      enabled: ${DATA_MERCHANT_API_RESPONSE_AUDIT_MQ_ENABLED:true}
  card-vault:
    # 默认关闭；所有密钥必须由 K8s Secret、CI/CD Secret 或 KMS 注入，禁止写入 Nacos 明文。
    enabled: ${CHECKOUT_CARD_VAULT_CONSUME_ENABLED:false}
    # 参数说明：Checkout 传输密钥标识，用于选择对应 RSA 私钥；轮换时必须先发布新公钥再切换该标识。
    transfer-key-id: ${CHECKOUT_CARD_VAULT_TRANSFER_KEY_ID:checkout-card-vault-v1}
    # 参数说明：Card Vault 传输 RSA 私钥的 PKCS#8 Base64；必须由外部 Secret 注入，配置中心默认必须为空。
    transfer-private-key-pkcs8-base64: ${CHECKOUT_CARD_VAULT_TRANSFER_PRIVATE_KEY_PKCS8_BASE64:}
    # 参数说明：PAN HMAC Pepper 版本号，写入卡资料记录用于后续多版本校验和安全轮换。
    pan-hmac-key-version: ${CHECKOUT_CARD_VAULT_PAN_HMAC_KEY_VERSION:v1}
    # 参数说明：PAN 去重 HMAC Pepper；属于高敏密钥，必须由 KMS/Secret 注入且不得记录日志。
    pan-hmac-pepper: ${CHECKOUT_CARD_VAULT_PAN_HMAC_PEPPER:}
    # 参数说明：包裹数据加密密钥的 KEK 版本号，必须与 KMS 中真实版本保持一致。
    kek-version: ${CHECKOUT_CARD_VAULT_KEK_VERSION:v1}
    # 参数说明：KEK 的 Base64 密钥正文；必须由外部 Secret 注入，生产禁止保存到普通 Nacos DataId。
    kek-base64: ${CHECKOUT_CARD_VAULT_KEK_BASE64:}
  merchant-notification:
    mq:
      # 只有 service-data 注册商户通知消费者，service-payment 不再消费或发送回调。
      # 环境说明：环境变量：DATA_MERCHANT_NOTIFICATION_MQ_ENABLED，dev 配置默认值为 "true"；test/uat/prod 必须按环境安全策略显式配置，禁止无评审沿用开发开关。
      enabled: ${DATA_MERCHANT_NOTIFICATION_MQ_ENABLED:true}
    # 商户回调建连和读取超时，单位毫秒。
    # 环境说明：环境变量：DATA_MERCHANT_NOTIFICATION_CONNECT_TIMEOUT_MILLIS，dev 配置默认值为 "3000"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
    connect-timeout-millis: ${DATA_MERCHANT_NOTIFICATION_CONNECT_TIMEOUT_MILLIS:3000}
    # 参数说明：配置 HTTP 读取响应超时，单位毫秒；需覆盖下游正常 P99 延迟。
    # 环境说明：环境变量：DATA_MERCHANT_NOTIFICATION_READ_TIMEOUT_MILLIS，dev 配置默认值为 "10000"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
    read-timeout-millis: ${DATA_MERCHANT_NOTIFICATION_READ_TIMEOUT_MILLIS:10000}
    # 必须大于 HTTP 总超时，避免仍在请求中的任务被另一实例重复回收。
    # 环境说明：环境变量：DATA_MERCHANT_NOTIFICATION_PROCESSING_TIMEOUT_SECONDS，dev 配置默认值为 "60"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
    processing-timeout-seconds: ${DATA_MERCHANT_NOTIFICATION_PROCESSING_TIMEOUT_SECONDS:60}
    # 单季度每次只读取有界超时候选，再逐条执行带分片键、版本和状态的 CAS。
    # 环境说明：环境变量：DATA_MERCHANT_NOTIFICATION_RECOVERY_BATCH_LIMIT，dev 默认值为 "100"；有效范围 1-500。
    recovery-batch-limit: ${DATA_MERCHANT_NOTIFICATION_RECOVERY_BATCH_LIMIT:100}
    # 回调 JWT 有效期只覆盖单次 HTTP 请求，最大 300 秒。
    callback-jwt-ttl-seconds: ${DATA_MERCHANT_NOTIFICATION_CALLBACK_JWT_TTL_SECONDS:180}
    # JWT Secret 和响应公钥正文只在当前 JVM 短时驻留，禁止写入 Redis。
    security-material-cache-ttl: ${DATA_MERCHANT_NOTIFICATION_SECURITY_MATERIAL_CACHE_TTL:2m}
    # 参数说明：单实例最多缓存的商户回调安全材料数量；超过后按缓存策略淘汰，防止堆内存无界增长。
    security-material-cache-max-entries: ${DATA_MERCHANT_NOTIFICATION_SECURITY_MATERIAL_CACHE_MAX_ENTRIES:2048}
internal-service:
  auth:
    # enabled 安全门禁固定在本地，补偿调用仅允许 service-job 访问数据内部接口。
    callers:
      service-job:
        # 参数说明：Job 调用 Data 补偿接口时使用的当前验签密钥引用。
        active-secret: ${acquiring.internal-auth.edges.job-data.active-secret}
        # 参数说明：Job-Data 密钥滚动轮换期间接受的上一版密钥；非轮换窗口为空。
        previous-secret: ${acquiring.internal-auth.edges.job-data.previous-secret:}
        allowed-paths:
          # 路径说明：允许 Job 执行数据落库和商户通知补偿；不得暴露为浏览器或商户直接访问接口。
          - /internal/data/**
      service-admin:
        # 参数说明：Admin 查询、下载和人工重试导出任务时使用的独立验签密钥。
        active-secret: ${acquiring.internal-auth.edges.admin-data.active-secret}
        # 参数说明：Admin-Data 密钥滚动轮换期间接受的上一版密钥；平时为空。
        previous-secret: ${acquiring.internal-auth.edges.admin-data.previous-secret:}
        allowed-paths:
          # 路径说明：仅开放异步导出任务内部接口，不允许访问其他Data内部能力。
          - /internal/data/export-tasks/**
      service-merchant:
        # 参数说明：Merchant 创建、查询、重试和下载自身异步导出任务时使用的独立验签密钥。
        active-secret: ${acquiring.internal-auth.edges.merchant-data.active-secret}
        previous-secret: ${acquiring.internal-auth.edges.merchant-data.previous-secret:}
        allowed-paths:
          # 路径说明：仅开放商户导出任务接口，不允许访问 Data 其他内部能力。
          - /internal/data/merchant-export-tasks/**
    # 参数说明：内部 HMAC 请求时间戳允许的最大偏差，默认 5 分钟；所有节点必须保持时钟同步。
    allowed-clock-skew: 5m
    # 参数说明：内部请求 nonce 防重放记录保留时间，默认 10 分钟，必须覆盖签名有效窗口。
    nonce-ttl: 10m
