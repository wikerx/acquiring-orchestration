# service-admin 专属配置：管理后台服务个性化参数。
acquiring:
  openapi:
    merchant-key-export:
      sdk-version: ${OPENAPI_JAVA_SDK_VERSION:0.9.0}
      crypto-mode: ${OPENAPI_CRYPTO_MODE:JWT + RSA-OAEP-256 + A256GCM}

admin:
  payment-client:
    internal-caller: ${PAYMENT_INTERNAL_CALLER:service-admin}
    internal-secret: ${PAYMENT_INTERNAL_SECRET:dev-internal-service-secret}
