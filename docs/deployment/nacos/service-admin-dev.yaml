# service-admin 专属配置：管理后台服务个性化参数。
acquiring:
  openapi:
    merchant-key-export:
      # 参数说明：声明对外提供的 OpenAPI SDK 版本，仅用于下载/展示时必须与发布产物一致。
      # 环境说明：环境变量：OPENAPI_JAVA_SDK_VERSION，dev 配置默认值为 "0.9.0"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
      sdk-version: ${OPENAPI_JAVA_SDK_VERSION:0.9.0}
      # 参数说明：声明 OpenAPI SDK 使用的签名与加密套件，仅可选择双方已实现并完成安全评审的模式。
      # 环境说明：环境变量：OPENAPI_CRYPTO_MODE，dev 配置默认值为 "JWT + RSA-OAEP-256 + A256GCM"；test/uat/prod 必须选择已完成该环境验证的模式，切换时保留回退方案。
      crypto-mode: ${OPENAPI_CRYPTO_MODE:JWT + RSA-OAEP-256 + A256GCM}

admin:
  payment-client:
    # 参数说明：指定内部服务调用方标识，必须与被调用方签名白名单一致。
    # 环境说明：环境变量：PAYMENT_INTERNAL_CALLER，dev 配置默认值为 "service-admin"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
    internal-caller: ${PAYMENT_INTERNAL_CALLER:service-admin}
    # 参数说明：配置内部服务 HMAC-SHA256 共享密钥，调用方与被调用方必须使用同一环境的密钥。
    # 环境说明：环境变量：PAYMENT_INTERNAL_SECRET；文件中的弱默认值仅供 dev 配置本地联调，test/uat/prod 必须使用独立高强度 Secret 注入并定期轮换。
    internal-secret: ${PAYMENT_INTERNAL_SECRET:dev-internal-service-secret}
