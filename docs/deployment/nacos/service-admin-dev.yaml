# service-admin 专属配置：管理后台服务个性化参数。
acquiring:
  gateway-ingress:
    # 与 service-gateway 共享环境专属入口签名密钥；UAT/生产必须开启门户路径保护。
    secret: ${acquiring.internal-auth.edges.gateway-checkout.active-secret}
  mq:
    outbox:
      # 参数说明：service-admin 启动后首次扫描通用 MQ Outbox 到期消息前的等待时间，单位毫秒。
      # 30000 表示等待 30 秒再执行首轮补偿，避开应用启动阶段数据库连接池、Redis 和 RocketMQ 初始化峰值。
      # 正常消息仍由业务事务提交后的即时 Relay 发送，本参数只影响进程退出、线程池拒绝或 MQ 短暂故障后的补偿扫描。
      # 环境说明：环境变量 ADMIN_MQ_OUTBOX_RELAY_INITIAL_DELAY_MS；dev 默认 30000，test/uat/prod 应按故障恢复 SLA 单独配置。
      relay-initial-delay-ms: ${ADMIN_MQ_OUTBOX_RELAY_INITIAL_DELAY_MS:30000}
      # 参数说明：service-admin 每轮通用 MQ Outbox 到期消息扫描完成后，到下一轮扫描开始前的固定等待时间，单位毫秒。
      # 30000 表示空闲状态下每 30 秒查询一次；最坏情况下，即时投递失败的消息会比原 5 秒配置晚约 25 秒被补偿发现。
      # 调小会提高异常消息发现速度，但会按 Admin 实例数增加 sys_mq_outbox 主库空查询；禁止配置为无间隔或毫秒级轮询。
      # 环境说明：环境变量 ADMIN_MQ_OUTBOX_RELAY_DELAY_MS；dev 默认 30000，生产建议根据告警和恢复目标设置为 5000～10000。
      relay-delay-ms: ${ADMIN_MQ_OUTBOX_RELAY_DELAY_MS:30000}
      # 参数说明：service-admin 启动后首次恢复超时 PROCESSING 消息前的等待时间，单位毫秒。
      # 60000 表示启动 1 分钟后再检查异常占用，必须与 processing-timeout-seconds 配合，不能早于正常消息发送超时。
      # 环境说明：环境变量 ADMIN_MQ_OUTBOX_RECOVERY_INITIAL_DELAY_MS；dev 默认 60000，其他环境需覆盖为经容量验证的值。
      recovery-initial-delay-ms: ${ADMIN_MQ_OUTBOX_RECOVERY_INITIAL_DELAY_MS:60000}
      # 参数说明：相邻两次 PROCESSING 超时恢复执行之间的固定等待时间，单位毫秒；该任务会向 sys_mq_outbox 主库发送条件 UPDATE。
      # 60000 表示每分钟检查一次，实际恢复时间最多比 processing-timeout-seconds 定义的超时点再晚一个调度周期。
      # 环境说明：环境变量 ADMIN_MQ_OUTBOX_RECOVERY_DELAY_MS；dev 默认 60000，缩短前必须评估主库写入频率和多实例重复执行。
      recovery-delay-ms: ${ADMIN_MQ_OUTBOX_RECOVERY_DELAY_MS:60000}
      # 参数说明：service-admin 启动后首次聚合通用 MQ Outbox 状态指标前的等待时间，单位毫秒。
      # 指标用于积压和失败告警，不参与消息投递；60000 表示启动 1 分钟后采集首个样本，避免启动阶段执行聚合查询。
      # 环境说明：环境变量 ADMIN_MQ_OUTBOX_METRICS_INITIAL_DELAY_MS；dev 默认 60000，监控平台采集周期变化时应同步评估。
      metrics-initial-delay-ms: ${ADMIN_MQ_OUTBOX_METRICS_INITIAL_DELAY_MS:60000}
      # 参数说明：通用 MQ Outbox 数据库状态指标相邻两次聚合之间的固定等待时间，单位毫秒。
      # 60000 表示每分钟刷新一次；提高频率不会加快消息补偿，只会增加历史 Outbox 状态聚合查询压力。
      # 环境说明：环境变量 ADMIN_MQ_OUTBOX_METRICS_DELAY_MS；dev 默认 60000，长期数据增长后应配合终态记录归档治理。
      metrics-delay-ms: ${ADMIN_MQ_OUTBOX_METRICS_DELAY_MS:60000}
  monitor:
    datasource-sampling:
      # 参数说明：是否执行 Admin 启动及后台定时数据源采样；false 只关闭持续查询，访问监控页面仍会按需采样。
      # dev 默认关闭以避免无人查看时持续查询 performance_schema；test/uat/prod 应按监控需求和数据库容量显式配置。
      scheduled-enabled: ${ADMIN_DATASOURCE_SAMPLING_SCHEDULED_ENABLED:false}
      # 参数说明：后台采样周期，单位毫秒；仅在 scheduled-enabled=true 时生效，页面按需采样仍受一分钟节流保护。
      # 生产调小前必须评估 Admin 实例数、performance_schema 开销和慢 SQL TopN 查询成本。
      fixed-rate-ms: ${ADMIN_DATASOURCE_SAMPLING_FIXED_RATE_MS:60000}
    datasource-console:
      # 参数说明：是否在数据源监控页提供外部 Druid 控制台入口；Druid 不是 JDBC 默认监控，目标服务必须实际使用 DruidDataSource。
      enabled: ${ADMIN_DATASOURCE_CONSOLE_ENABLED:false}
      # 参数说明：Druid 控制台完整地址，支持 HTTP/HTTPS、私网和回环主机；禁止在 URL 中携带用户名或密码。
      # 环境说明：示例为 http://127.0.0.1:8001/druid/index.html；test/uat/prod 应指向本环境受控运维地址。
      url: ${ADMIN_DATASOURCE_CONSOLE_URL:}
  openapi:
    merchant-key-export:
      # 参数说明：声明对外提供的 OpenAPI SDK 版本，仅用于下载/展示时必须与发布产物一致。
      # 环境说明：环境变量：OPENAPI_JAVA_SDK_VERSION，dev 配置默认值为 "0.9.0"；test/uat/prod 应按容量、超时和业务策略分别覆盖并完成压测验证。
      sdk-version: ${OPENAPI_JAVA_SDK_VERSION:0.9.0}
      # 参数说明：声明 OpenAPI SDK 使用的签名与加密套件，仅可选择双方已实现并完成安全评审的模式。
      # 环境说明：环境变量：OPENAPI_CRYPTO_MODE，dev 配置默认值为 "JWT + RSA-OAEP-256 + A256GCM"；test/uat/prod 必须选择已完成该环境验证的模式，切换时保留回退方案。
      crypto-mode: ${OPENAPI_CRYPTO_MODE:JWT + RSA-OAEP-256 + A256GCM}

payment:
  mfa:
    # Admin MFA 主密钥必须与 Merchant 独立，由 Nacos 受控脚本迁移和保留。
    secret: __NACOS_MANAGED_ADMIN_MFA_SECRET__
    previous-secrets: __NACOS_MANAGED_ADMIN_MFA_PREVIOUS_SECRETS__
    allow-ephemeral-test-secret: false
  merchant:
    cache-invalidation:
      # 参数说明：service-admin 启动后首次扫描商户及永久业务缓存失效 Outbox 前的等待时间，单位毫秒。
      # 30000 表示启动 30 秒后执行首轮补偿；正常数据变更仍在事务提交后立即发布失效事件，不依赖本任务轮询。
      # 环境说明：环境变量 ADMIN_MERCHANT_CACHE_INVALIDATION_RELAY_INITIAL_DELAY_MS；dev 默认 30000，生产按缓存一致性 SLA 配置。
      relay-initial-delay-ms: ${ADMIN_MERCHANT_CACHE_INVALIDATION_RELAY_INITIAL_DELAY_MS:30000}
      # 参数说明：商户及永久业务缓存失效补偿每轮执行完成后，到下一轮扫描开始前的固定等待时间，单位毫秒。
      # 30000 表示每 30 秒扫描一次未成功发布的失效事件；只影响异常补偿速度，不改变正常事务提交后的缓存失效链路。
      # 环境说明：环境变量 ADMIN_MERCHANT_CACHE_INVALIDATION_RELAY_FIXED_DELAY_MS；dev 默认 30000，缩短会增加主库空查询。
      relay-fixed-delay-ms: ${ADMIN_MERCHANT_CACHE_INVALIDATION_RELAY_FIXED_DELAY_MS:30000}
  risk:
    # 当前 Risk 字段加密密钥；占位符只能由 Nacos 受控脚本替换，禁止直接发布模板。
    secret: __NACOS_MANAGED_ADMIN_RISK_SECRET__
    # 密钥轮换兼容窗口内的旧 Risk 密钥；无旧密钥时发布为空字符串。
    previous-secrets: __NACOS_MANAGED_ADMIN_RISK_PREVIOUS_SECRETS__
    allow-ephemeral-test-secret: false
    # 仅纯 dev 可在数据迁移期读取历史固定密钥密文，禁止在其他环境开启。
    allow-legacy-dev-key-decryption: __NACOS_MANAGED_ADMIN_RISK_LEGACY_DECRYPTION__
    cache-invalidation:
      # 参数说明：service-admin 启动后首次扫描风控规则缓存失效 Outbox 前的等待时间，单位毫秒。
      # 30000 表示启动 30 秒后执行首轮补偿；规则变更成功后的 generation 即时发布路径保持不变。
      # 环境说明：环境变量 ADMIN_RISK_CACHE_INVALIDATION_RELAY_INITIAL_DELAY_MS；dev 默认 30000，生产按风控规则生效 SLA 配置。
      relay-initial-delay-ms: ${ADMIN_RISK_CACHE_INVALIDATION_RELAY_INITIAL_DELAY_MS:30000}
      # 参数说明：风控规则缓存失效补偿每轮执行完成后，到下一轮扫描开始前的固定等待时间，单位毫秒。
      # 30000 表示每 30 秒扫描一次待补偿事件；异常期间最长发现延迟随该值增加，但正常发布和规则查询性能不受影响。
      # 环境说明：环境变量 ADMIN_RISK_CACHE_INVALIDATION_RELAY_FIXED_DELAY_MS；dev 默认 30000，禁止配置成无间隔轮询。
      relay-fixed-delay-ms: ${ADMIN_RISK_CACHE_INVALIDATION_RELAY_FIXED_DELAY_MS:30000}
  ip:
    lookup:
      # IP 命中结果写入共享 String Key 的物理有效期，使用 Spring Duration；默认 PT6H 表示 6 小时。
      # 管理端与 OpenAPI 必须保持一致，避免同一 IP 被不同服务反复改写为不同生命周期。
      hit-ttl: ${PAYMENT_IP_LOOKUP_HIT_TTL:PT6H}
      # 合法 IP 未命中结果的物理有效期，使用 Spring Duration；默认 PT2M 用于抑制随机 IP 穿透且避免长期空缓存。
      # 管理端与 OpenAPI 必须保持一致，调整前应评估从库压力和数据发布后的收敛时间。
      miss-ttl: ${PAYMENT_IP_LOOKUP_MISS_TTL:PT2M}
      # 从 SLAVE 刷新 IP 分片及数据版本快照的固定延迟，单位毫秒；60000 表示每次刷新完成后等待 1 分钟。
      # 新版本在从库可见后，管理端与 OpenAPI 会拒绝旧版本缓存并在下一次访问时覆盖相同短 Key。
      route-refresh-ms: ${PAYMENT_IP_LOOKUP_ROUTE_REFRESH_MS:60000}

admin:
  operations:
    work-item:
      # 渠道金额、币种或状态存在紧急差异时，统一待办要求在三十分钟内进入来源案件处理流程。
      channel-abnormal-critical-sla: ${ADMIN_WORK_ITEM_CHANNEL_ABNORMAL_CRITICAL_SLA:PT30M}
      # 高风险渠道勾兑异常默认一小时处理，可按环境运营值覆盖但不得使用零值或负值。
      channel-abnormal-high-sla: ${ADMIN_WORK_ITEM_CHANNEL_ABNORMAL_HIGH_SLA:PT1H}
      # 普通查询不确定等预警异常默认四小时处理，不改变支付核心案件状态机。
      channel-abnormal-warning-sla: ${ADMIN_WORK_ITEM_CHANNEL_ABNORMAL_WARNING_SLA:PT4H}
      # 清分人工复核或无后续重试计划的异常默认一小时处理；统一待办不得直接修改清分状态。
      clearing-backlog-sla: ${ADMIN_WORK_ITEM_CLEARING_BACKLOG_SLA:PT1H}
      # 结算批次进入 MANUAL_REVIEW 后默认一小时处理；统一待办只投影状态，不执行重试或取消。
      settlement-backlog-sla: ${ADMIN_WORK_ITEM_SETTLEMENT_BACKLOG_SLA:PT1H}
      # CRITICAL 高风险事件默认三十分钟响应，HIGH 或 REJECT 事件默认两小时响应。
      high-risk-critical-sla: ${ADMIN_WORK_ITEM_HIGH_RISK_CRITICAL_SLA:PT30M}
      high-risk-event-sla: ${ADMIN_WORK_ITEM_HIGH_RISK_EVENT_SLA:PT2H}
  clearing-client:
    # 参数说明：清分命令服务地址；管理端页面查询仍使用 service-admin 本地逻辑数据源。
    # 环境说明：dev 默认使用 Nacos 服务名；跨集群部署时改为本环境内部 HTTPS 地址。
    base-url: ${ADMIN_CLEARING_BASE_URL:http://service-clearing}
    # 参数说明：建立清分内部 HTTP 连接的最大等待时间，单位毫秒，必须为正整数。
    connect-timeout-millis: ${ADMIN_CLEARING_CONNECT_TIMEOUT_MILLIS:3000}
    # 参数说明：等待清分命令响应的最大时间，单位毫秒，应覆盖单次补偿命令的正常 P99。
    read-timeout-millis: ${ADMIN_CLEARING_READ_TIMEOUT_MILLIS:30000}
    # 参数说明：写入内部签名头的固定调用方标识；必须与验签端 callers 键完全一致，不允许环境覆盖。
    internal-caller: service-admin
    # 参数说明：Admin 到 Clearing 调用边的当前 HMAC 密钥引用；密钥正文由受控脚本合入当前服务 DataId。
    internal-secret: ${acquiring.internal-auth.edges.admin-clearing.active-secret}
  settlement-client:
    # 参数说明：结算命令服务地址；手工结算、审批、取消和冲正必须通过该内部鉴权接口执行。
    # 环境说明：dev 默认使用 Nacos 服务名；跨集群部署时改为本环境内部 HTTPS 地址。
    base-url: ${ADMIN_SETTLEMENT_BASE_URL:http://service-settlement}
    # 参数说明：建立结算内部 HTTP 连接的最大等待时间，单位毫秒，必须为正整数。
    connect-timeout-millis: ${ADMIN_SETTLEMENT_CONNECT_TIMEOUT_MILLIS:3000}
    # 参数说明：等待结算命令响应的最大时间，单位毫秒，应覆盖同步状态机和落库处理的正常 P99。
    read-timeout-millis: ${ADMIN_SETTLEMENT_READ_TIMEOUT_MILLIS:30000}
    # 参数说明：结算内部请求的固定可信调用方标识，禁止改成登录用户名或前端上送值。
    internal-caller: service-admin
    # 参数说明：Admin 到 Settlement 调用边的当前 HMAC 密钥引用；只能通过密钥管理脚本轮换。
    internal-secret: ${acquiring.internal-auth.edges.admin-settlement.active-secret}
  payment-client:
    # 参数说明：支付管理命令的固定可信调用方标识，必须保持 service-admin。
    internal-caller: service-admin
    # 参数说明：Admin 到 Payment 调用边的当前 HMAC 密钥引用，用于请款、撤销、退款和异常处置命令。
    internal-secret: ${acquiring.internal-auth.edges.admin-payment.active-secret}
  job-client:
    # 参数说明：任务管理命令的固定可信调用方标识，必须保持 service-admin。
    internal-caller: service-admin
    # 参数说明：Admin 到 Job 调用边的当前 HMAC 密钥引用，用于后台任务启停和人工触发命令。
    internal-secret: ${acquiring.internal-auth.edges.admin-job.active-secret}
  data-client:
    # 参数说明：异步导出 Data 服务地址；dev 默认通过 Nacos 服务发现访问 service-data。
    base-url: ${ADMIN_DATA_EXPORT_BASE_URL:http://service-data}
    # 参数说明：建立 Data 内部连接的最大等待时间，单位毫秒。
    connect-timeout-millis: ${ADMIN_DATA_EXPORT_CONNECT_TIMEOUT_MILLIS:3000}
    # 参数说明：任务管理和私有文件流读取超时，受平台内部同步调用60秒硬上限约束。
    read-timeout-millis: ${ADMIN_DATA_EXPORT_READ_TIMEOUT_MILLIS:60000}
    # 参数说明：Admin 到 Data 调用边的固定服务身份，禁止替换为登录账号。
    internal-caller: service-admin
    # 参数说明：Admin 到 Data 独立 HMAC 密钥引用，不复用 Admin-Job 或 Job-Data 密钥。
    internal-secret: ${acquiring.internal-auth.edges.admin-data.active-secret}

internal-service:
  auth:
    # enabled 安全门禁固定在本地 application.yml；此处只维护调用方凭据、权限路径和防重放时间窗。
    callers:
      service-job:
        # 参数说明：Job 调用 Admin 汇率评估与运营待办同步命令时使用的当前验签密钥引用。
        active-secret: ${acquiring.internal-auth.edges.job-admin.active-secret}
        # 参数说明：Job-Admin 密钥滚动轮换期间接受的上一版密钥；平时为空。
        previous-secret: ${acquiring.internal-auth.edges.job-admin.previous-secret:}
        allowed-paths:
          # 路径说明：精确放行两个 Job 编排命令，禁止扩大到其他管理接口或使用通配符。
          - /internal/admin/exchange/alerts/evaluate
          - /internal/admin/operations/work-items/sync
      service-data:
        # 参数说明：Data 回调 Admin 权威导出源时使用的独立验签密钥。
        active-secret: ${acquiring.internal-auth.edges.data-admin.active-secret}
        # 参数说明：Data-Admin 密钥滚动轮换期间接受的上一版密钥；平时为空。
        previous-secret: ${acquiring.internal-auth.edges.data-admin.previous-secret:}
        allowed-paths:
          # 路径说明：仅允许分页读取冻结范围内的待办和交易域导出数据。
          - /internal/admin/operations/work-items/export-page
          - /internal/admin/transactions/orders/export-page
          - /internal/admin/transactions/operations/export-page
          - /internal/admin/transactions/merchant-notifications/export-page
          - /internal/admin/transactions/refunds/export-page
          - /internal/admin/settlement/result-items/export-page
          - /internal/admin/settlement/reserve-items/export-page
      service-merchant:
        # 参数说明：遗留 Merchant 到 Admin 兼容接口的当前验签密钥；正常商户查询不得走该远程链路。
        active-secret: ${acquiring.internal-auth.edges.merchant-admin.active-secret}
        # 参数说明：兼容接口密钥轮换期间接受的上一版密钥；非轮换窗口解析为空字符串。
        previous-secret: ${acquiring.internal-auth.edges.merchant-admin.previous-secret:}
        allowed-paths:
          # 路径说明：仅覆盖仍保留的遗留商户内部接口，禁止扩展为 Admin 页面或任意通配入口。
          - /internal/merchant/**
    # 参数说明：内部签名时间戳允许的最大时钟偏差，使用 Spring Duration；生产节点必须启用 NTP。
    allowed-clock-skew: 5m
    # 参数说明：内部请求 nonce 防重放记录保留时间，必须大于允许时钟偏差和请求最长执行时间。
    nonce-ttl: 10m
