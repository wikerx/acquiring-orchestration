        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存交易维度账单地址和邮编等信息，供卡组织、渠道、风控、争议场景使用。
      transaction-additional-info:
        enabled: true
        logical-table: transaction_additional_info
        template-table: transaction_additional_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存循环付款、分期、Hosted Checkout、二维码、支付链接等扩展属性，避免主表字段膨胀。
      transaction-authentication-info:
        enabled: true
        logical-table: transaction_authentication_info
        template-table: transaction_authentication_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存3DS、SCA、渠道/卡组织认证结果，支撑交易详情页认证信息展示和后续责任转移判断。
      transaction-product-item:
        enabled: true
        logical-table: transaction_product_item
        template-table: transaction_product_item
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存商户上送的商品/订单项目明细，支撑交易详情页商品列表、风控摘要、争议和人工排查。
      transaction-channel-request:
        enabled: true
        logical-table: transaction_channel_request
        template-table: transaction_channel_request
        id-column: id
