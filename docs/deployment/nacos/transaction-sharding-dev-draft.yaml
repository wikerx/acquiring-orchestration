      transaction-finance-state:
        enabled: true
        logical-table: transaction_finance_state
        template-table: transaction_finance_state
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存交易维度结算、对账、入账当前状态和批次关联。
      transaction-currency-conversion:
        enabled: true
        logical-table: transaction_currency_conversion
        template-table: transaction_currency_conversion
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
