# 交易核心表分表配置草案：v1.6 最终交易表口径。
# 当前文件用于评审；实际 dev 环境加载 docs/deployment/nacos/sharding-dev.yaml。
global-payment:
  sharding:
    # 分表策略。quarter 表示按 transaction_date_time 所在季度分表。
    strategy: quarter
    # 数据库统一时区。所有交易时间字段按 UTC+8 写入和路由，避免跨时区导致季度判断不一致。
    database-timezone: Asia/Shanghai
    # 全局默认分表字段。参与分表的表必须在写入和查询时传入该字段。
    sharding-column: transaction_date_time

    table-maintenance:
      # 是否启用分表物理表治理能力。关闭后只保留规则展示，不执行预建表。
      enabled: true
      # 是否检查并预创建当前季度物理表。
      pre-create-current-quarter: true
      # 是否检查并预创建下一季度物理表。
      pre-create-next-quarter: true
      # 目标表已存在时是否对比模板表结构。
      compare-schema-if-exists: true
      # DDL 必须走主库，禁止在 slave 分组或只读库上执行建表。
      ddl-data-source: master
      # 创建物理表后是否设置 AUTO_INCREMENT 起始值。
      set-auto-increment-start-value: true
      # 自增序号宽度，yyyyQQ 后拼接 12 位自增序号。
      auto-increment-sequence-width: 12
      # 是否允许基于模板表 CREATE TABLE target LIKE template。
      allow-create-from-template-table: true
      # 第一版禁止自动 ALTER 已存在表结构，结构不一致只登记告警。
      allow-alter-existing-table: false

    id-generator:
      # 使用 MySQL 自增主键，并通过 AUTO_INCREMENT 起始值形成 yyyyQQ 前缀。
      mode: mysql-auto-increment-prefix
      prefix-format: yyyyQQ
      sequence-width: 12
      start-sequence: 1
      max-sequence: 999999999999

    # 参与分表的逻辑表清单。key 仅用于配置归类，物理表名必须使用 logical-table 生成。
    tables:
      test-transaction:
        enabled: true
        logical-table: test_transaction
        template-table: test_transaction
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 测试交易主表，按交易时间季度分表。
      test-transaction-info:
        enabled: true
        logical-table: test_transaction_info
        template-table: test_transaction_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 测试交易信息表，按交易时间季度分表。
      test-transaction-merge-info:
        enabled: true
        logical-table: test_transaction_merge_info
        template-table: test_transaction_merge_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 测试交易附属信息表，按交易时间季度分表。
      test-transaction-status-info:
        enabled: true
        logical-table: test_transaction_status_info
        template-table: test_transaction_status_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 测试交易状态信息表，按交易时间季度分表。
      transaction-order:
        enabled: true
        logical-table: transaction_order
        template-table: transaction_order
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 交易生命周期主单；同一笔原始交易的授权、增量授权、请款、退款、拒付等动作共用同一个 operation_id。
      transaction-operation:
        enabled: true
        logical-table: transaction_operation
        template-table: transaction_operation
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 交易动作单；授权、增量授权、请款、退款、Void、拒付等每一个动作一条记录。
      transaction-merchant-snapshot:
        enabled: true
        logical-table: transaction_merchant_snapshot
        template-table: transaction_merchant_snapshot
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存交易发生时的商户、渠道、MID、费率、结算、内风控配置快照，避免后续配置变更影响历史交易解释。
      transaction-payment-method-info:
        enabled: true
        logical-table: transaction_payment_method_info
        template-table: transaction_payment_method_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存卡、钱包、令牌、渠道绑卡标识等支付工具摘要。
      transaction-payer-info:
        enabled: true
        logical-table: transaction_payer_info
        template-table: transaction_payer_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
        start-quarter: 1
        end-year: 2035
        end-quarter: 4
        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存付款人身份、联系方式、IP、设备摘要，用于风控、审计和后台展示。
      transaction-billing-info:
        enabled: true
        logical-table: transaction_billing_info
        template-table: transaction_billing_info
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
