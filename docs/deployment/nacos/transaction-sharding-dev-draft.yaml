        table-name-format: "%s_%d%02d"
        actual-data-source: master
        description: 保存DCC、渠道币种转换EDC、结算换汇、退款换汇等汇率报价、换算金额和舍入规则快照。
      transaction-merchant-notification:
        enabled: true
        logical-table: transaction_merchant_notification
        template-table: transaction_merchant_notification
        id-column: id
        sharding-column: transaction_date_time
        start-year: 2026
