# 公共配置：所有服务都会加载，用于统一时间格式、监控端点和链路追踪字段。
spring:
  jackson:
    # 数据库和接口默认使用 UTC+8，避免交易时间跨环境解析不一致。
    time-zone: Asia/Shanghai
    # 接口和日志中常用的时间字符串格式。
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        # 暴露基础健康检查、服务信息和 Prometheus 指标。
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        # 显式启用 Prometheus Registry；生产环境仍必须由内网采集和访问控制保护端点。
        enabled: true
  metrics:
    tags:
      # 所有业务指标携带固定服务名，禁止使用实例运行时业务标识作为公共标签。
      application: ${spring.application.name}
      # 环境标签用于隔离 dev、test、uat、prod 告警和仪表盘。
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        # Redis 业务路径和 Lettuce 命令需要直方图才能在 Prometheus 聚合 P95/P99。
        acquiring.redis.operation.duration: true
        # 参数说明：控制是否为 acquiring.redis.cache.invalidation.outbox.batch.duration 指标生成直方图，以支持 P95/P99 聚合。
        acquiring.redis.cache.invalidation.outbox.batch.duration: true
        # 参数说明：控制是否为 lettuce.command.completion 指标生成直方图，以支持 P95/P99 聚合。
        lettuce.command.completion: true

global-payment:
  trace:
    # 全链路追踪请求头名称，网关、OpenAPI、业务服务保持一致。
    header-name: X-Trace-Id
