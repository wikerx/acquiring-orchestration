# service-openapi 专属配置：开放 API 鉴权、幂等、回调重试等参数。
acquiring:
  gateway-ingress:
    # 与 dev Gateway 保持一致；环境变量优先覆盖，非 dev 环境禁止复用该默认值。
    secret: ${CHECKOUT_GATEWAY_INGRESS_SECRET:2acee5d27b34b556d0a9b0123e2277870558d57f39968820a0b00edc1d3b7a12}
    allowed-clock-skew-millis: ${CHECKOUT_GATEWAY_INGRESS_ALLOWED_SKEW_MILLIS:60000}

openapi:
  hosted-checkout:
    # callback 和 redirect URL 的字段级加密密钥；必须与 service-payment 一致。
    sensitive-field-encryption-key: ${PAYMENT_TRANSACTION_SENSITIVE_FIELD_ENCRYPTION_KEY:dev-hosted-checkout-field-key-change-me}
    sensitive-field-key-version: ${PAYMENT_TRANSACTION_SENSITIVE_FIELD_KEY_VERSION:dev-v1}
  merchant:
    # JWT iat/exp 与服务器时间允许的最大偏差，单位秒。
    timestamp-tolerance-seconds: 300
    # 请求唯一标识 jti 的防重放缓存时间，单位秒。
    replay-cache-ttl-seconds: 600
  notify:
    # 商户通知最大重试次数。
    max-retry-times: 8
    # 商户通知失败后的重试 Topic。
    retry-topic: merchant-notify-retry
  payment-client:
    # dev 联调默认走 service-payment 微服务，调用链路为 service-gateway -> service-openapi -> service-payment。
    remote-enabled: true
