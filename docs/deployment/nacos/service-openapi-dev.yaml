# service-openapi 专属配置：开放 API 鉴权、幂等、回调重试等参数。
acquiring:
  gateway-ingress:
    # OpenAPI 外部入口必须由 Gateway 签发；密钥正文由受控脚本合入同一服务 DataId。
    secret: ${acquiring.internal-auth.edges.gateway-checkout.active-secret}
    # 参数说明：Gateway 入口签名时间戳允许偏差，单位毫秒；过大会扩大重放窗口，过小会放大时钟抖动。
    allowed-clock-skew-millis: ${CHECKOUT_GATEWAY_INGRESS_ALLOWED_SKEW_MILLIS:60000}

openapi:
  merchant:
    # JWT iat/exp 与服务器时间允许的最大偏差，单位秒。
    timestamp-tolerance-seconds: 300
    # 请求唯一标识 jti 的防重放缓存时间，单位秒。
    replay-cache-ttl-seconds: 600
  notify:
    # 商户通知最大重试次数。
    max-retry-times: 8
    # 商户通知失败后的重试 Topic。
    retry-topic: merchant-notify-retry
  payment-client:
    # dev 联调默认走 service-payment 微服务，调用链路为 service-gateway -> service-openapi -> service-payment。
    # 同步内部调用统一采用 3 秒建连、30 秒读取默认值，任何环境均不得超过 60 秒上限。
    connect-timeout-millis: ${OPENAPI_PAYMENT_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${OPENAPI_PAYMENT_READ_TIMEOUT_MILLIS:30000}
    # 参数说明：支付内部协议的固定调用方标识，必须保持 service-openapi。
    internal-caller: service-openapi
    # 参数说明：OpenAPI 到 Payment 调用边的当前 HMAC 密钥引用。
    internal-secret: ${acquiring.internal-auth.edges.openapi-payment.active-secret}
  payout-client:
    # 代付同步内部调用必须快速失败，超时结果由业务状态查询或补偿链路收敛。
    connect-timeout-millis: ${OPENAPI_PAYOUT_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${OPENAPI_PAYOUT_READ_TIMEOUT_MILLIS:30000}
    # 参数说明：代付内部协议的固定调用方标识，必须保持 service-openapi。
    internal-caller: service-openapi
    # 参数说明：OpenAPI 到 Payout 调用边的当前 HMAC 密钥引用。
    internal-secret: ${acquiring.internal-auth.edges.openapi-payout.active-secret}
  security:
    secret-cache:
      # 密钥正文只允许在当前 JVM 短时驻留，Redis 仅保存非敏感 revision。
      ttl: PT2M
      # 参数说明：单实例最多缓存的商户安全材料数量；超过后必须淘汰，禁止形成无界高敏缓存。
      max-entries: 2048
    replay:
      # dev 允许 Redis 暂不可用时联调；UAT/生产由本地 Profile 强制为 true。
      required: false

payment:
  openapi:
    rate-limit:
      # 是否启用第二层商户限流；true 时同一 merchantId 的全部 OpenAPI 接口共享额度。
      enabled: ${OPENAPI_MERCHANT_RATE_LIMIT_ENABLED:true}
      # 单个商户在滚动窗口内允许通过的请求数，必须为正整数；dev 当前按每分钟 200 次配置。
      max-requests: ${OPENAPI_MERCHANT_RATE_LIMIT_MAX_REQUESTS:2000}
      # 精确滑动窗口长度，支持 1m、60s、PT1M 等 Spring Duration 格式，必须大于 0。
      window: ${OPENAPI_MERCHANT_RATE_LIMIT_WINDOW:1m}
      # Redis 故障时单个 OpenAPI 实例最多保留的商户数；达到上限后拒绝新身份，防止 JVM 内存无界增长。
      local-max-identities: ${OPENAPI_RATE_LIMIT_LOCAL_MAX_IDENTITIES:10000}
      # Redis 故障策略仅允许 LOCAL_FALLBACK 或 FAIL_CLOSED；dev 使用本机有界窗口继续联调。
      # LOCAL_FALLBACK 为实例内计数，集群最坏可放行约“额度 × OpenAPI 实例数”，不得作为生产全局额度依据。
      failure-policy: ${OPENAPI_RATE_LIMIT_FAILURE_POLICY:LOCAL_FALLBACK}
  card-bin:
    cache:
      # OpenAPI 独立启动且当前 Redis 索引缺失或格式过期时从 SLAVE 重建；generation 门禁保证集群只有一个发布者。
      index-initializer-enabled: ${PAYMENT_CARD_BIN_CACHE_INDEX_INITIALIZER_ENABLED:true}
      # 从 SLAVE 按 id 递增读取索引源的单页行数，范围 1 至 10000；增大可减少 SQL 次数但会提高单页内存。
      index-page-size: ${PAYMENT_CARD_BIN_CACHE_INDEX_PAGE_SIZE:2000}
      # 单个前缀字段允许比较的候选上限，范围 1 至 1000；超限表示基础数据存在异常重叠并回源 SLAVE。
      max-candidates-per-prefix: ${PAYMENT_CARD_BIN_CACHE_MAX_CANDIDATES_PER_PREFIX:64}
      # 单次发布允许写入的分片索引总数；查询输入不会创建 Redis Key，防止随机 BIN 扩大缓存基数。
      max-expanded-entries: ${PAYMENT_CARD_BIN_CACHE_MAX_EXPANDED_ENTRIES:3000000}
      # 单次 Lua 最多追加的候选条数，范围 1 至 200；默认 100 避免长时间占用 Redis 事件循环。
      write-batch-entries: ${PAYMENT_CARD_BIN_CACHE_WRITE_BATCH_ENTRIES:100}
      # 单次 Lua 参数估算字节上限，范围 1024 至 1048576；默认 131072 即 128 KiB。
      write-batch-bytes: ${PAYMENT_CARD_BIN_CACHE_WRITE_BATCH_BYTES:131072}
      # 完整分片索引估算字节预算，必须不小于单批上限；默认 536870912 即 512 MiB。
      max-snapshot-bytes: ${PAYMENT_CARD_BIN_CACHE_MAX_SNAPSHOT_BYTES:536870912}
      # 发布锁租约，使用 Spring Duration 且必须大于 0；每页处理完成后续租，默认 PT5M 即五分钟。
      publication-lease: ${PAYMENT_CARD_BIN_CACHE_PUBLICATION_LEASE:PT5M}
  ip:
    lookup:
      # IP 命中 JSON String 的物理有效期，使用 Spring Duration；默认 PT6H，缩短可提高回收速度，增大会降低从库压力。
      hit-ttl: ${PAYMENT_IP_LOOKUP_HIT_TTL:PT6H}
      # 合法 IP 未命中 JSON String 的物理有效期，使用 Spring Duration；默认 PT2M，用于抑制随机 IP 穿透。
      miss-ttl: ${PAYMENT_IP_LOOKUP_MISS_TTL:PT2M}
      # 从 SLAVE 刷新 IP 分片路由快照的固定延迟，单位毫秒；60000 表示上次刷新完成后等待一分钟。
      route-refresh-ms: ${PAYMENT_IP_LOOKUP_ROUTE_REFRESH_MS:60000}
