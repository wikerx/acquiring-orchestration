# ShardingSphere-JDBC 交易逻辑路由与物理表治理的 dev 已发布非秘密配置。
# actualDataNodes 只包含已建表且通过治理校验的季度；变更后必须重新计算并校验规则 checksum。
transaction-sharding:
  # 参数说明：分表规则版本标识；拓扑、表清单或路由规则变化时递增，便于服务启动时核对发布批次。
  rule-version: "2026.08.25-002-candidate-clearing-28"
  # 参数说明：当前规则正文的 SHA-256 校验值；发布前必须由治理流程重新计算，禁止手工随意修改。
  rule-checksum: "sha256:8ec98c2d65d9324d758d48c71343606496eebbe7bcd00d1e6adf3c46f63dd15a"
  # 参数说明：数据库和分片季度计算使用的 IANA 时区，必须与 JDBC serverTimezone 及数据库会话时区一致。
  database-zone-id: Asia/Shanghai
  # 参数说明：逻辑表季度路由字段；所有直连写入和范围查询都必须携带该交易时间。
  sharding-column: transaction_date_time
  # 参数说明：ShardingSphere 写入和强一致读取使用的主数据源名称，必须与 dataSource DataId 一致。
  primary-data-source: master
  # 集合说明：只读副本数据源名称；生产按复制延迟和一致性要求决定是否承载查询，禁止用于资金写入。
  replica-data-sources:
    - slave_1
    - slave_2
  # 集合说明：已完成 28 张逻辑表建表和结构校验的季度节点，格式为 yyyyQQ；未验收季度不得提前加入。
  physical-nodes:
    - "202603"
    - "202604"
  # 集合说明：参与统一季度路由的交易逻辑表；新增或删除表必须同步 DDL、治理表清单和 checksum。
  logic-tables:
    - transaction_order
    - transaction_operation
    - transaction_merchant_snapshot
    - transaction_payment_method_info
    - transaction_payer_info
    - transaction_billing_info
    - transaction_shipping_info
    - transaction_additional_info
    - transaction_authentication_info
    - transaction_product_item
    - transaction_channel_request
    - transaction_channel_interaction_log
    - transaction_channel_callback
    - transaction_channel_callback_log
    - transaction_flow_event
    - transaction_status_history
    - transaction_amount_change_log
    - transaction_finance_state
    - transaction_currency_conversion
    - transaction_merchant_notification
    - transaction_merchant_notification_log
    - transaction_merchant_api_interaction_log
    - transaction_event_outbox
    - transaction_abnormal_event
    - transaction_card_vault
    - transaction_clearing_detail
    - transaction_reserve_clearing_detail
    - transaction_reserve_clearing_state
  # 集合说明：允许直接访问交易分片数据源的服务白名单；不得用该列表替代应用层 RBAC 或内部接口鉴权。
  direct-access-services:
    - service-payment
    - service-admin
    - service-merchant
    - service-risk
    - service-data
    - service-clearing
    - service-settlement
  # 查询预算用于限制跨季度聚合和导出对主从库的冲击，生产值应结合慢查询与连接池容量评估。
  query-budget:
    # 参数说明：同步查询最大执行时间，单位毫秒；超时后应提示缩小日期范围，禁止无限等待。
    synchronous-timeout-millis: 5000
    # 参数说明：单次同步查询允许返回的最大行数；更大数据集必须走受控导出任务。
    max-result-rows: 1000
    # 参数说明：同一操作人允许并发执行的导出任务数，防止重复点击耗尽连接和内存。
    max-concurrent-exports-per-user: 1

  # 下列配置只供 Job/Admin 的模板、DDL、schema 和号段治理直连链路使用。
  governance:
    # 分表策略。quarter 表示按 transaction_date_time 所在季度分表。
    strategy: quarter
    # 数据库统一时区。所有交易时间字段按 UTC+8 写入和路由，避免跨时区导致季度判断不一致。
    database-timezone: Asia/Shanghai
    # 全局默认分表字段。参与分表的表必须在写入和查询时传入该字段。
    sharding-column: transaction_date_time
    # 在协议支持上限结束前四个季度告警。
    expiry-warning-quarters: 4
    # Admin 只展示当前季度起的有限规划窗口，禁止把 2099 协议上限展开为待建表清单。
    planning-horizon-quarters: 8

    table-maintenance:
      # 是否启用分表物理表治理能力。关闭后只保留规则展示，不执行预建表。
      enabled: true
      # 是否检查并预创建当前季度物理表。
      pre-create-current-quarter: true
      # 是否检查并预创建下一季度物理表。
      pre-create-next-quarter: true
      # 目标表已存在时是否对比模板表结构。
      compare-schema-if-exists: true
      # DDL 必须走主库，禁止在 slave 分组或只读库上执行建表。
      ddl-data-source: master
      # 创建物理表后是否设置 AUTO_INCREMENT 起始值。
      set-auto-increment-start-value: true
      # 自增序号宽度，yyyyQQ 后拼接 12 位自增序号。
      auto-increment-sequence-width: 12
      # 是否允许基于模板表 CREATE TABLE target LIKE template。
      allow-create-from-template-table: true
      # 第一版禁止自动 ALTER 已存在表结构，结构不一致只登记告警。
      allow-alter-existing-table: false

    id-generator:
      # 使用 MySQL 自增主键，并通过 AUTO_INCREMENT 起始值形成 yyyyQQ 前缀。
      mode: mysql-auto-increment-prefix
      # 参数说明：配置分片自增编号的时间前缀格式，变更会影响编号解析兼容性。
      prefix-format: yyyyQQ
      # 参数说明：配置分片表自增序列位数，必须与 max-sequence 一致。
      sequence-width: 12
      # 参数说明：配置分片表自增序列起始值，必须大于等于 1。
      start-sequence: 1
      # 参数说明：配置单时间片可分配的最大序列号，必须与 sequence-width/sequence-length 容量一致。
      max-sequence: 999999999999

    # 参与分表的逻辑表清单。key 仅用于配置归类，物理表名必须使用 logical-table 生成。
    tables:
      transaction-order:
        # 参数说明：控制当前功能是否启用：true 开启，false 关闭；UAT/生产变更前必须确认依赖和降级影响。
        enabled: true
        # 参数说明：指定业务代码访问的逻辑表名，必须与 Mapper 和分片规则一致。
        logical-table: transaction_order
        # 参数说明：指定创建季度物理表时复制结构的模板表，必须完成结构审核。
        template-table: transaction_order
        # 参数说明：指定分片物理表主键列名，必须与模板表结构一致。
        id-column: id
        # 参数说明：指定季度分片路由字段；写入和查询必须提供该交易时间字段。
        sharding-column: transaction_date_time
        # 参数说明：配置分片表预生成范围的起始年份。
        start-year: 2026
        # 参数说明：配置分片表预生成范围的起始季度，有效值为 1-4。
        start-quarter: 3
        # 参数说明：配置分片表预生成范围的结束年份，必须覆盖业务数据保留周期。
        end-year: 2099
        # 参数说明：配置分片表预生成范围的结束季度，有效值为 1-4。
        end-quarter: 4
        # 参数说明：配置季度物理表名格式，参数依次为逻辑表名、年份和季度。
        table-name-format: "%s_%d%02d"
        # 参数说明：指定该逻辑表执行 DDL 和路由时使用的数据源，资金写入必须指向可写主库。
        actual-data-source: master
        # 参数说明：说明该分片表承载的业务数据，仅用于治理展示，不参与路由计算。
        description: 交易生命周期主单；同一笔原始交易的授权、增量授权、请款、退款、拒付等动作共用同一个 operation_id。
      transaction-operation:
        # 参数说明：控制当前功能是否启用：true 开启，false 关闭；UAT/生产变更前必须确认依赖和降级影响。
        enabled: true
        # 参数说明：指定业务代码访问的逻辑表名，必须与 Mapper 和分片规则一致。
        logical-table: transaction_operation
        # 参数说明：指定创建季度物理表时复制结构的模板表，必须完成结构审核。
        template-table: transaction_operation
        # 参数说明：指定分片物理表主键列名，必须与模板表结构一致。
        id-column: id
        # 参数说明：指定季度分片路由字段；写入和查询必须提供该交易时间字段。
        sharding-column: transaction_date_time
        # 参数说明：配置分片表预生成范围的起始年份。
        start-year: 2026
        # 参数说明：配置分片表预生成范围的起始季度，有效值为 1-4。
        start-quarter: 3
        # 参数说明：配置分片表预生成范围的结束年份，必须覆盖业务数据保留周期。
        end-year: 2099
        # 参数说明：配置分片表预生成范围的结束季度，有效值为 1-4。
        end-quarter: 4
        # 参数说明：配置季度物理表名格式，参数依次为逻辑表名、年份和季度。
        table-name-format: "%s_%d%02d"
        # 参数说明：指定该逻辑表执行 DDL 和路由时使用的数据源，资金写入必须指向可写主库。
        actual-data-source: master
        # 参数说明：说明该分片表承载的业务数据，仅用于治理展示，不参与路由计算。
        description: 交易动作单；授权、增量授权、请款、退款、Void、拒付等每一个动作一条记录。
      transaction-merchant-snapshot:
        # 参数说明：控制当前功能是否启用：true 开启，false 关闭；UAT/生产变更前必须确认依赖和降级影响。
        enabled: true
        # 参数说明：指定业务代码访问的逻辑表名，必须与 Mapper 和分片规则一致。
        logical-table: transaction_merchant_snapshot
        # 参数说明：指定创建季度物理表时复制结构的模板表，必须完成结构审核。
