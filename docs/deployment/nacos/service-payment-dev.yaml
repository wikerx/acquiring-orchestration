# service-payment 专属配置：收单交易核心、幂等、消息事件等参数。
payment:
  order:
    # 收单支付平台订单号前缀。
    prefix: PA
  idempotent:
    # 创建交易幂等锁默认有效期，单位秒。
    create-ttl-seconds: 600
  event:
    # 支付创建事件 Topic。
    topic: payment-event
    # 交易动作创建事件 Tag。
    created-tag: TRANSACTION_CREATED
  transaction:
    merchant-notification:
      mq:
        # 商户通知消费者默认关闭，避免未配置 RocketMQ 的环境启动时误注册消费者；需要真实消费时显式设置为 true。
        enabled: ${PAYMENT_MERCHANT_NOTIFICATION_MQ_ENABLED:false}
