# Redis 配置：本地开发环境统一连接 Redis 6.2.23 Cluster（3 Master + 3 Replica）。
spring:
  data:
    redis:
      # Redis Cluster 只允许 DB 0。
      database: 0
      # 本地开发集群密码；部署到其他环境必须通过环境变量覆盖。
      password: ${REDIS_PASSWORD:scott123456Admin@123}
      cluster:
        nodes:
          - ${REDIS_CLUSTER_NODE_1:127.0.0.1:7001}
          - ${REDIS_CLUSTER_NODE_2:127.0.0.1:7002}
          - ${REDIS_CLUSTER_NODE_3:127.0.0.1:7003}
          - ${REDIS_CLUSTER_NODE_4:127.0.0.1:7004}
          - ${REDIS_CLUSTER_NODE_5:127.0.0.1:7005}
          - ${REDIS_CLUSTER_NODE_6:127.0.0.1:7006}
        # 限制 MOVED/ASK 重定向次数，异常拓扑下快速失败。
        max-redirects: 5
      # 建立 TCP 连接的最大等待时间。
      connect-timeout: 3s
      # 单次 Redis 操作超时时间。
      timeout: 5s
      lettuce:
        cluster:
          refresh:
            # MOVED、ASK、连接重建等事件触发拓扑刷新。
            adaptive: true
            # 同时周期刷新，覆盖未触发自适应事件的拓扑变化。
            period: 30s
            dynamic-refresh-sources: true
        pool:
          # Lettuce 连接池最大活跃连接数。
          max-active: 16
          # 最大空闲连接数。
          max-idle: 8
          # 最小空闲连接数。
          min-idle: 1
          # 获取连接最大等待时间。
          max-wait: 2s

payment:
  redis:
    # 所有直接业务 Key 的统一系统和环境前缀；不同环境必须配置不同值。
    key-prefix: ${PAYMENT_REDIS_KEY_PREFIX:acquiring:dev}
    mq-dedup:
      # 单个 MQ 去重时间桶最多保存的 SHA-256 消息摘要数量；超限后降级到数据库唯一约束。
      max-members-per-bucket: ${PAYMENT_REDIS_MQ_DEDUP_MAX_MEMBERS_PER_BUCKET:100000}
      # MQ 去重 TTL 的配置上限，单位秒；默认 30 天，防止误配置形成长期大 Key。
      max-ttl-seconds: ${PAYMENT_REDIS_MQ_DEDUP_MAX_TTL_SECONDS:2592000}
    generic:
      # 风控规则缓存仍依赖 String 包装器；新增调用必须先登记 Key、TTL 和失败策略。
      string-enabled: ${PAYMENT_REDIS_GENERIC_STRING_ENABLED:true}
      # 无生产调用的集合包装器默认关闭，需要业务化设计和评审后才能显式启用。
      hash-enabled: ${PAYMENT_REDIS_GENERIC_HASH_ENABLED:false}
      list-enabled: ${PAYMENT_REDIS_GENERIC_LIST_ENABLED:false}
      set-enabled: ${PAYMENT_REDIS_GENERIC_SET_ENABLED:false}
      zset-enabled: ${PAYMENT_REDIS_GENERIC_ZSET_ENABLED:false}
  cache:
    redis:
      # 是否启用 Spring Cache + Redis。缓存只用于高频读路径减压，交易事实仍以数据库为准。
      enabled: ${PAYMENT_CACHE_REDIS_ENABLED:true}
      # Spring Cache 与直接业务 Key 共用系统和环境前缀，Cache Name 继续提供领域与数据集层级。
      key-prefix: ${PAYMENT_CACHE_REDIS_KEY_PREFIX:acquiring:dev}
      # 未单独配置缓存名称时的默认 TTL。
      default-ttl: ${PAYMENT_CACHE_REDIS_DEFAULT_TTL:10m}
      # 安全缓存失效门禁属于恢复性租约；到期只清理异常标记，可靠失效仍由事务 Outbox 重试保证。
      invalidation-gate-ttl: ${PAYMENT_CACHE_INVALIDATION_GATE_TTL:2h}
      ttl:
        # 商户最小运行时资料为常驻读模型；后台变更通过可靠失效链路删除后按需重建。
        "[merchant:info]": ${PAYMENT_CACHE_MERCHANT_INFO_TTL:0s}
        # 商户 OpenAPI IP 聚合策略为常驻安全读模型；白名单或开关变化后可靠失效。
        "[merchant:openapi]": ${PAYMENT_CACHE_MERCHANT_OPENAPI_TTL:0s}
        # 仅四个非敏感公开 URL 参数进入常驻缓存；敏感配置禁止写入 Redis。
        "[config:public]": ${PAYMENT_CACHE_PUBLIC_CONFIG_TTL:0s}
  global-id:
    # 是否启用全系统统一唯一标识生成器自动装配。
    enabled: true
    # dev 默认使用 Redis 分布式模式；local 只允许单元测试和离线工具显式覆盖。
    mode: redis
    # 编号时间片格式化时区。
    timezone: Asia/Shanghai
    # 毫秒内序列固定 6 位。
    sequence-length: 6
    # 毫秒内最大序列。
    max-sequence: 999999
    # 单个 Hash 原子保存 last_millis 和 sequence；单 Key 不使用无必要的 Redis Cluster Hash Tag。
    state-key: ${PAYMENT_GLOBAL_ID_STATE_KEY:acquiring:dev:global-id:state}
    # 序列溢出后最大重试次数。
    max-retry-times: 3
    # 序列溢出后短暂等待下一毫秒。
    retry-sleep-millis: 1
    # 正常启动必须为 false；只有完成备份校验、历史最大编号核对和双人审批后才能临时开启。
    restore-acknowledged: ${PAYMENT_GLOBAL_ID_RESTORE_ACKNOWLEDGED:false}
    # 正常启动固定为 0；受控恢复时必须高于所有历史已签发编号的时间片 epochMillis。
    restore-floor-epoch-millis: ${PAYMENT_GLOBAL_ID_RESTORE_FLOOR_EPOCH_MILLIS:0}
