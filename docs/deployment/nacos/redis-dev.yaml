# Redis 配置：本地开发环境使用单机模式，业务侧通过 component-redis 统一访问。
spring:
  redis:
    # Redis database 编号。
    database: 0
    # 本地单机 Redis 默认无密码；如后续接入鉴权，可通过环境变量覆盖。
    password: ${REDIS_PASSWORD:}
    # 本地 Redis 单机地址。
    host: ${REDIS_HOST:127.0.0.1}
    # 本地 Redis 单机端口。
    port: ${REDIS_PORT:6379}
    # 单次 Redis 操作超时时间。
    timeout: 2s
    lettuce:
      pool:
        # Lettuce 连接池最大活跃连接数。
        max-active: 32
        # 最大空闲连接数。
        max-idle: 16
        # 最小空闲连接数。
        min-idle: 4
        # 获取连接最大等待时间。
        max-wait: 2s
