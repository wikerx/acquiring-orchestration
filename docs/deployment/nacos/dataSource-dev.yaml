# 数据源配置：系统只注册 master 和 slave；dev 默认两者指向同一个 MySQL。
spring:
  datasource:
    dynamic:
      # 默认数据源。未显式声明 @DS 时走 master。
      primary: master
      # 严格模式。访问不存在的数据源时直接失败，避免静默落到默认库。
      strict: true
      datasource:
        master:
          # 主库：负责新增、更新、删除和未显式声明的访问。
          type: com.zaxxer.hikari.HikariDataSource
          # 参数说明：指定 JDBC 驱动类，必须与数据库类型和项目依赖版本匹配。
          driver-class-name: com.mysql.cj.jdbc.Driver
          # 参数说明：配置 JDBC 连接 URL；每个环境必须连接本环境数据库并显式设置时区和 TLS 策略。
          # 环境说明：环境变量：MYSQL_MASTER_URL（dev 配置默认 "jdbc:mysql://127.0.0.1:3306/payment_acquiring?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"）；test/uat/prod 必须指向本环境可达的基础设施，禁止跨环境连接。
          url: ${MYSQL_MASTER_URL:jdbc:mysql://127.0.0.1:3306/payment_acquiring?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
          # 参数说明：配置外部组件账号；UAT/生产必须使用最小权限的环境专属账号。
          # 环境说明：环境变量：MYSQL_MASTER_USERNAME（文件中的账号默认值仅供 dev 配置本地联调）；test/uat/prod 必须注入本环境最小权限账号，禁止使用 nacos、root 等开发默认账号。
          username: ${MYSQL_MASTER_USERNAME:root}
          # 参数说明：配置访问外部组件的密码，必须按环境通过 Secret 注入并定期轮换。
          # 环境说明：环境变量：MYSQL_MASTER_PASSWORD；文件中的弱默认值仅供 dev 配置本地联调，test/uat/prod 必须使用独立高强度 Secret 注入并定期轮换。
          password: ${MYSQL_MASTER_PASSWORD:scott123456}
          hikari:
            # 参数说明：配置数据库连接池名称，用于日志和监控区分数据源。
            pool-name: payment-acquiring-master
            # 参数说明：配置 HikariCP 最小空闲连接数，不能大于 maximum-pool-size。
            minimum-idle: 5
            # 参数说明：配置 HikariCP 最大连接数；多服务实例总连接数不能超过数据库容量。
            maximum-pool-size: 20
            # 参数说明：配置 HikariCP 获取数据库连接的超时，单位毫秒。
            connection-timeout: 30000
            # 参数说明：配置 HikariCP 空闲连接回收时间，单位毫秒。
            idle-timeout: 600000
            # 参数说明：配置 HikariCP 连接最大生命周期，单位毫秒，应小于数据库或网络层连接回收时间。
            max-lifetime: 1800000
        slave:
          # 唯一从库：负责允许复制延迟的查询、统计和报表；dev 阶段可复用主库地址。
          type: com.zaxxer.hikari.HikariDataSource
          # 参数说明：指定 JDBC 驱动类，必须与数据库类型和项目依赖版本匹配。
          driver-class-name: com.mysql.cj.jdbc.Driver
          # 参数说明：配置 JDBC 连接 URL；每个环境必须连接本环境数据库并显式设置时区和 TLS 策略。
          # 环境说明：MYSQL_SLAVE_URL 指向本环境唯一只读实例；dev 默认连接本地库，test/uat/prod 禁止跨环境连接。
          url: ${MYSQL_SLAVE_URL:jdbc:mysql://127.0.0.1:3306/payment_acquiring?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
          # 参数说明：配置外部组件账号；UAT/生产必须使用最小权限的环境专属账号。
          # 环境说明：MYSQL_SLAVE_USERNAME 仅授予查询权限；文件默认值只供 dev 本地联调，test/uat/prod 必须通过 Secret 注入。
          username: ${MYSQL_SLAVE_USERNAME:root}
          # 参数说明：配置访问外部组件的密码，必须按环境通过 Secret 注入并定期轮换。
          # 环境说明：MYSQL_SLAVE_PASSWORD 必须通过环境 Secret 管理；文件弱默认值只供 dev 本地联调。
          password: ${MYSQL_SLAVE_PASSWORD:scott123456}
          hikari:
            # 参数说明：配置数据库连接池名称，用于日志和监控区分数据源。
            pool-name: payment-acquiring-slave
            # 参数说明：配置 HikariCP 最小空闲连接数，不能大于 maximum-pool-size。
            minimum-idle: 5
            # 参数说明：配置 HikariCP 最大连接数；多服务实例总连接数不能超过数据库容量。
            maximum-pool-size: 20
            # 参数说明：配置 HikariCP 获取数据库连接的超时，单位毫秒。
            connection-timeout: 30000
            # 参数说明：配置 HikariCP 空闲连接回收时间，单位毫秒。
            idle-timeout: 600000
            # 参数说明：配置 HikariCP 连接最大生命周期，单位毫秒，应小于数据库或网络层连接回收时间。
            max-lifetime: 1800000

mybatis-plus:
  # Mapper XML 扫描路径，后续业务 mapper 放在各服务或组件模块 resources/mapper 下。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性。
    map-underscore-to-camel-case: true
    # 支付系统查询默认不使用 MyBatis 二级缓存，避免资金状态缓存不一致。
    cache-enabled: false
    # 统一交给 SLF4J/Logback 输出 SQL；禁止使用 StdOutImpl 绕过日志级别、归档和采集链路。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 为所有 Mapper statement Logger 增加统一前缀，避免为了查看 SQL 将整个业务包调整为 DEBUG。
    log-prefix: sql.mybatis.
  global-config:
    # 关闭 MyBatis-Plus banner，减少服务启动日志噪音。
    banner: false

logging:
  level:
    # MyBatis/Plus SQL 与绑定参数日志级别。dev 默认 DEBUG；设为 OFF 可统一关闭。
    # DEBUG 会输出绑定值，排查结束后应关闭，UAT/生产禁止长期启用。
    sql.mybatis: ${SQL_LOG_LEVEL:DEBUG}
    # JdbcTemplate 和 NamedParameterJdbcTemplate 最终均由 JdbcTemplate 执行，DEBUG 输出 SQL 模板但不输出绑定值。
    org.springframework.jdbc.core.JdbcTemplate: ${SQL_LOG_LEVEL:DEBUG}
    # 直接使用 JDBC PreparedStatement 的少量固定监控 SQL 使用该专用 Logger。
    sql.jdbc.direct: ${SQL_LOG_LEVEL:DEBUG}
    # Spring JDBC 绑定参数由 StatementCreatorUtils 在 TRACE 输出，默认关闭以避免记录卡号和商户敏感字段。
    # 仅在隔离开发环境短时排查参数绑定问题时设置 SQL_PARAMETER_LOG_LEVEL=TRACE。
    org.springframework.jdbc.core.StatementCreatorUtils: ${SQL_PARAMETER_LOG_LEVEL:OFF}
