services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: acquiring-local-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../reliability-alert-rules.yml:/etc/prometheus/rules/reliability-alert-rules.yml:ro
      - ./reliability-drill-alert-rules.yml:/etc/prometheus/rules/reliability-drill-alert-rules.yml:ro
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: acquiring-local-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
